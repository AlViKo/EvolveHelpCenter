[phases.setup]
nixPkgs = ["nodejs_22", "python313"]

[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "cd frontend && npm install"
]

[phases.build]
cmds = [
    "cd frontend && npm run build"
]

[start]
cmd = "python manage.py migrate --noinput && python manage.py seed_content --content-dir ./content && python manage.py collectstatic --noinput && gunicorn evolve_help.wsgi:application --bind 0.0.0.0:${PORT:-8000}"
